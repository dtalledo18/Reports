<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Weekly Report - Advanced Roofing</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="report-container">

    <!-- ── WEEK SELECTOR BAR ──────────────────────────────── -->
    <div class="week-selector-bar">
        <span class="selector-label">Week:</span>
        <div class="selector-wrapper">
            <select id="weekSelect" class="week-select"></select>
            <svg class="select-arrow" viewBox="0 0 10 6" fill="none">
                <path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
        <span class="week-badge" id="weekBadge"></span>
    </div>

    <!-- ── REPORT CARD ────────────────────────────────────── -->
    <div class="report-card-wrap">

        <!-- Header -->
        <header class="report-header">
            <div class="header-top">
                <h1 class="report-title">Marketing Weekly Report 2026</h1>
                <div class="company-logo-container">
                    <img src="img/logo.png" alt="Advanced Roofing Logo" onerror="this.style.display='none'">
                </div>
            </div>
        </header>

        <!-- Executive Summary -->
        <section class="section-summary">
            <h2 class="section-title">Executive Summary</h2>
            <p class="summary-text" id="summaryText"></p>
        </section>

        <!-- Main Grid: Leads + Meta -->
        <div class="report-grid">

            <!-- LEFT: Leads Hero Card -->
            <div class="leads-hero-card">
                <div class="leads-comparison-grid">
                    <div class="stat-group">
                        <div class="sidebar-label">Historical Leads</div>
                        <div class="main-stat-box">
                            <div class="total-leads-value" id="historicalLeads">—</div>
                            <div class="date-sub-label" id="historicalRange"></div>
                        </div>
                    </div>
                    <div class="stat-group">
                        <div class="sidebar-label">Weekly Leads</div>
                        <div class="main-stat-box">
                            <div class="total-leads-value" id="weeklyLeads">—</div>
                            <div class="date-sub-label" id="weeklyRange"></div>
                        </div>
                    </div>
                </div>

                <div class="stat-separator"></div>

                <div class="metrics-row">
                    <div class="stat-group">
                        <div class="avg-leads-value" id="avgLeads">—</div>
                        <div class="avg-leads-label">Avg. Daily Leads</div>
                    </div>
                    <div class="stat-group">
                        <input type="text" class="contacts-needed-input" id="contactsNeeded" value="—" spellcheck="false">
                        <div class="avg-leads-label">Contacts Needed</div>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Meta Performance -->
            <div class="meta-simplified-section">
                <div class="meta-brand-header">
                    <svg class="meta-icon" viewBox="0 0 24 24">
                        <path d="M12 2C6.477 2 2 6.477 2 12c0 5.011 3.69 9.154 8.54 9.873v-6.984H7.995V12h2.545V9.412c0-2.512 1.496-3.899 3.783-3.899 1.096 0 2.242.196 2.242.196v2.464h-1.262c-1.244 0-1.63.772-1.63 1.562V12h2.778l-.444 2.889h-2.334v6.984C18.31 21.154 22 17.011 22 12c0-5.523-4.477-10-10-10z"/>
                    </svg>
                    <h3 class="meta-title">Meta Campaigns:</h3>
                </div>

                <table class="perf-table">
                    <thead>
                        <tr>
                            <th>Performance</th>
                            <th class="col-total">TOTAL</th>
                        </tr>
                    </thead>
                    <tbody id="metaTableBody">
                        <!-- Injected by app.js -->
                    </tbody>
                </table>
            </div>

        </div>

        <!-- Chart Section -->
        <section class="chart-section">
            <div class="chart-wrapper">
                <div class="chart-data-header" id="daysHeader">
                    <!-- Injected by app.js -->
                </div>
                <div class="canvas-container">
                    <canvas id="leadsSplineChart" role="img" aria-label="Daily leads chart for the selected week"></canvas>
                </div>
            </div>
        </section>

        <footer class="editor-footer">
            Live Interactive & Editable Panel · Advanced Roofing Team · Select a week · Edit any value directly
        </footer>

    </div><!-- /.report-card-wrap -->

</div><!-- /.report-container -->

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
